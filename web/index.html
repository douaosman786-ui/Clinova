<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Clinova — prise de rendez-vous médicaux / medical appointments">
  <meta name="theme-color" content="#0E6B6B">

  <!-- Installation sur l'écran d'accueil iPhone (Safari > Partager > Sur l'écran d'accueil) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Clinova">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>Clinova</title>
  <style>
    html, body { margin: 0; height: 100%; background: #F5F3EE; }
    #clinova-loader {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #0E6B6B; font-weight: 800; font-size: 26px; letter-spacing: -0.5px;
    }
    #clinova-loader img { width: 72px; height: 72px; border-radius: 18px; }
    #clinova-loader .bar { width: 120px; height: 3px; background: #E2DED5; border-radius: 3px; overflow: hidden; }
    #clinova-loader .bar::after {
      content: ""; display: block; width: 40%; height: 100%; background: #0E6B6B;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
  </style>
</head>
<body>
  <div id="clinova-loader">
    <img src="icons/Icon-192.png" alt="">
    <div>Clinova</div>
    <div class="bar"></div>
  </div>
  <script>
    // Retire l'écran de chargement dès que Flutter a affiché sa première image.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('clinova-loader');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
