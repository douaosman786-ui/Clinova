name: clinova
description: "Clinova - Clinic Appointment Management System (Flutter + Firebase)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Firebase (plan gratuit Spark : Auth + Cloud Firestore)
  firebase_core: '>=3.6.0 <6.0.0'
  firebase_auth: '>=5.3.0 <8.0.0'
  cloud_firestore: '>=5.4.0 <8.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
